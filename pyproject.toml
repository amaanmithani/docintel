[project]
name = "docintel"
version = "0.1.0"
description = "Table structure extraction (and simple form key-value linking) from document images, with an honest TEDS evaluation on PubTabNet."
readme = "README.md"
authors = [
    { name = "Amaan Mithani", email = "101476296+amaanmithani@users.noreply.github.com" }
]
license = { text = "MIT" }
requires-python = ">=3.12"
dependencies = [
    "apted>=1.0.3",
    "lxml>=5.0",
    "numpy>=1.26",
    "pillow>=10.0",
    "rapidfuzz>=3.14.6",
]

[project.optional-dependencies]
# Heavy runtime pieces. Not installed in CI: tests use a stub model and tiny fixtures.
model = [
    "torch>=2.2",
    "torchvision>=0.17",
    "transformers>=4.44,<5",
    "timm>=1.0",
]
data = [
    "huggingface-hub>=0.24",
    "pyarrow>=16.0",
]
ocr = [
    "pytesseract>=0.3.10",
]

[project.scripts]
docintel = "docintel.cli:main"

[dependency-groups]
dev = [
    "lxml-stubs>=0.5",
    "mypy>=1.11",
    "pyarrow>=16.0",
    "pytest>=8.3",
    "pytest-cov>=5.0",
    "ruff>=0.6",
]

[build-system]
requires = ["uv_build>=0.8.0,<0.12.0"]
build-backend = "uv_build"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF", "N", "PT"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["apted.*", "torch.*", "transformers.*", "pyarrow.*", "pytesseract.*", "huggingface_hub.*", "timm.*"]
ignore_missing_imports = true
follow_imports = "skip"  # heavy optional deps; absent in CI, so never type-check through them

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_defs = false
disallow_untyped_calls = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=docintel --cov-report=term-missing"

[tool.coverage.run]
branch = true
source = ["docintel"]
omit = ["src/docintel/tatr.py"]  # torch wrapper; everything downstream is tested with a stub

name: CI
on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

# CI never downloads models or datasets: `uv sync` installs only the core + dev groups
# (no `model`/`data`/`ocr` extras), and the tests use a stub model and tiny synthetic fixtures.
env:
  HF_HUB_OFFLINE: "1"

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run mypy
      - run: uv run docintel report --check  # README tables match results/*.json

  test:
    needs: quality
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv sync --locked
      - run: uv run pytest --cov-fail-under=75

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - run: uv build
